apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-devops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aws-devops-app
  template:
    metadata:
      labels:
        app: aws-devops-app
    spec:
      containers:
        - name: aws-devops-app
          image: deepakjogi433/aws-devops-app:latest
          ports:
            - containerPort: 5000